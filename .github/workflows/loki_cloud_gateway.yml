name: Loki 24/7 Cloud Gateway

on:
  workflow_dispatch:
  schedule:
    # Auto-triggers every 5 hours to ensure continuous 24/7 uptime
    - cron: '0 */5 * * *'
  push:
    branches: [ main, master ]

concurrency:
  group: loki-cloud-gateway
  cancel-in-progress: true

jobs:
  run-loki-gateway:
    name: 🚀 24/7 Autonomous Telegram Gateway
    runs-on: ubuntu-latest
    timeout-minutes: 355 # GitHub Actions max run duration

    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ⚡ Install uv & WunderCorp Loki Core
        run: |
          python -m pip install --upgrade pip uv
          git clone --depth 1 https://github.com/wundercorp/loki.git /tmp/loki-agent
          cd /tmp/loki-agent
          uv pip install --system -e .

      - name: ⚙️ Configure Cloud Environment & Secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_USERS: ${{ secrets.TELEGRAM_ALLOWED_USERS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_API_KEY_BACKUP: ${{ secrets.GEMINI_API_KEY_BACKUP }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          mkdir -p ~/.loki
          cat << 'EOF' > ~/.loki/config.yaml
          database:
            journal_mode: wal
          model:
            default: gemini-3.8-flash
            provider: gemini
          compression:
            enabled: true
            threshold: 0.5
          gateway:
            platforms:
              telegram:
                extra:
                  status_indicator: true
          EOF

          cat << EOF > ~/.loki/.env
          TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
          TELEGRAM_ALLOWED_USERS=${TELEGRAM_ALLOWED_USERS}
          GEMINI_API_KEY=${GEMINI_API_KEY}
          GOOGLE_API_KEY=${GOOGLE_API_KEY}
          GEMINI_API_KEY_BACKUP=${GEMINI_API_KEY_BACKUP}
          GROQ_API_KEY=${GROQ_API_KEY}
          OPENAI_API_KEY=${OPENAI_API_KEY}
          EOF

      - name: 🌐 Launch Autonomous 24/7 Telegram Gateway
        env:
          PYTHONPATH: /tmp/loki-agent
          LOKI_HOME: /home/runner/.loki
        run: |
          python3 -m loki_cli.main gateway run
