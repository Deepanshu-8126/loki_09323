name: Loki 24/7 Cloud Gateway

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

concurrency:
  group: loki-gateway
  cancel-in-progress: true

jobs:
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Loki
        run: |
          pip install --upgrade pip
          pip install loki-telegram || pip install git+https://github.com/wundercorp/loki.git

      - name: Configure Loki
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p ~/.loki
          cat << 'EOF' > ~/.loki/config.yaml
          database:
            journal_mode: delete
          model:
            default: gemini/gemini-1.5-flash
            context_length: 131072
          gateway:
            allow_all_users: true
            platforms:
              telegram:
                allow_all_users: true
          EOF

          # Telegram Login
          mkdir -p ~/.loki/gateway
          echo "$TELEGRAM_BOT_TOKEN" | python3 -m loki_cli.main auth login telegram --token-stdin

      - name: Run Gateway 24/7
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LOKI_TELEGRAM_ALLOW_ALL: "true"
        run: |
          echo "Starting Loki Gateway for 6 hours..."
          python3 -m loki_cli.main gateway run
