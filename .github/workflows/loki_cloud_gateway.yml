name: Loki 24/7 Cloud Gateway
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'
  push:
    branches: [ main, master ]

concurrency:
  group: loki-cloud-gateway
  cancel-in-progress: true

jobs:
  run-loki-gateway:
    name: 🚀 24/7 Autonomous Telegram Gateway
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4
      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: ⚡ Install uv, Loki Core & Telegram
        run: |
          python -m pip install --upgrade pip uv
          git clone --depth 1 https://github.com/wundercorp/loki.git /tmp/loki-agent
          cd /tmp/loki-agent
          uv pip install --system -e ".[messaging]" "python-telegram-bot[webhooks]>=21.0" aiohttp httpx

      - name: ⚙️ Configure Cloud Environment
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p ~/.loki
          cat << 'EOF' > ~/.loki/config.yaml
          database:
            journal_mode: delete
          model:
            default: gemini/gemini-1.5-flash
            context_length: 32000
          gateway:
            allow_all_users: true
            platforms:
              telegram:
                allow_all_users: true
          EOF
          cat << EOF > ~/.loki/.env
          TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
          TELEGRAM_ALLOWED_USERS=6486771356
          TELEGRAM_HOME_CHANNEL=6486771356
          GATEWAY_ALLOW_ALL_USERS=true
          TELEGRAM_ALLOW_ALL_USERS=true
          GROQ_API_KEY=${GROQ_API_KEY}
          GEMINI_API_KEY=${GEMINI_API_KEY}
          GOOGLE_API_KEY=${GEMINI_API_KEY}
          EOF

      - name: 🌐 Launch Gateway
        env:
          PYTHONPATH: /tmp/loki-agent
          LOKI_HOME: /home/runner/.loki
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_USERS: "6486771356"
          TELEGRAM_HOME_CHANNEL: "6486771356"
          GATEWAY_ALLOW_ALL_USERS: "true"
          TELEGRAM_ALLOW_ALL_USERS: "true"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 -m loki_cli.main gateway run
