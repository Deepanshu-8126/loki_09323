name: Loki 24/7 Cloud Gateway

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

concurrency:
  group: loki-cloud-gateway
  cancel-in-progress: true

jobs:
  gateway:
    name: 🚀 24/7 Autonomous Telegram Gateway
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ⚡ Install uv, Loki Core & Telegram Messaging Dependencies
        env:
          LOKI_NIX_BUILD: "1"
        run: |
          python -m pip install --upgrade pip uv
          git clone --depth 1 https://github.com/wundercorp/loki.git /tmp/loki-agent
          cd /tmp/loki-agent
          export LOKI_NIX_BUILD=1
          uv pip install --system -e ".[messaging]" || uv pip install --system -e .
          uv pip install --system "python-telegram-bot[webhooks]>=21.0" aiohttp httpx

      - name: ⚙️ Configure Loki & Authorization
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_USERS: ${{ secrets.TELEGRAM_ALLOWED_USERS }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          mkdir -p ~/.loki
          
          USER_ID="${TELEGRAM_ALLOWED_USERS:-6486771356}"
          
          cat << 'EOF' > ~/.loki/config.yaml
          database:
            journal_mode: delete
          model:
            default: llama-3.3-70b-versatile
            provider: custom
            base_url: https://api.groq.com/openai/v1
            context_length: 131072
          compression:
            enabled: true
            threshold: 0.35
            target_ratio: 0.15
            protect_last_n: 8
            protect_first_n: 2
          gateway:
            allow_all_users: true
            platforms:
              telegram:
                enabled: true
                allow_all_users: true
                extra:
                  status_indicator: true
                  allowed_users:
                    - "6486771356"
                    - "Dkx"
          EOF

          cat << EOF > ~/.loki/.env
          TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
          TELEGRAM_ALLOWED_USERS=6486771356,${USER_ID},Dkx
          TELEGRAM_HOME_CHANNEL=6486771356
          GATEWAY_ALLOW_ALL_USERS=true
          TELEGRAM_ALLOW_ALL_USERS=true
          CUSTOM_API_KEY=${GROQ_API_KEY}
          CUSTOM_BASE_URL=https://api.groq.com/openai/v1
          GROQ_API_KEY=${GROQ_API_KEY}
          GEMINI_API_KEY=${GEMINI_API_KEY}
          GOOGLE_API_KEY=${GOOGLE_API_KEY:-$GEMINI_API_KEY}
          OPENAI_API_KEY=${OPENAI_API_KEY}
          EOF

          # Telegram CLI Auth Token registration
          mkdir -p ~/.loki/gateway
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            echo "$TELEGRAM_BOT_TOKEN" | python3 -m loki_cli.main auth login telegram --token-stdin 2>/dev/null || true
          fi

      - name: 🌐 Launch Autonomous 24/7 Telegram Gateway
        env:
          PYTHONPATH: /tmp/loki-agent
          LOKI_HOME: /home/runner/.loki
          LOKI_NIX_BUILD: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_USERS: 6486771356,Dkx
          TELEGRAM_HOME_CHANNEL: "6486771356"
          GATEWAY_ALLOW_ALL_USERS: "true"
          TELEGRAM_ALLOW_ALL_USERS: "true"
          LOKI_TELEGRAM_ALLOW_ALL: "true"
          CUSTOM_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CUSTOM_BASE_URL: https://api.groq.com/openai/v1
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          echo "🚀 Starting Loki Autonomous Telegram Gateway..."
          cd /tmp/loki-agent
          export LOKI_NIX_BUILD=1
          if command -v loki &> /dev/null; then
            loki gateway run
          elif python3 -c "import loki_cli" 2>/dev/null; then
            python3 -m loki_cli.main gateway run
          else
            python3 -m loki gateway run
          fi
