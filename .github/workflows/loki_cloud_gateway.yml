name: Loki 24/7 Cloud Gateway & Auto-Git Sync

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

concurrency:
  group: loki-cloud-gateway
  cancel-in-progress: true

jobs:
  gateway:
    name: 🚀 24/7 Autonomous Telegram Gateway + Auto-Git Sync
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ⚙️ Setup Git Config
        run: |
          git config --global user.name "Loki Autonomous Bot"
          git config --global user.email "loki-bot@users.noreply.github.com"
          git config --global pull.rebase true

      - name: ⚡ Install uv, Loki Core & Telegram Messaging Dependencies
        env:
          LOKI_NIX_BUILD: "1"
        run: |
          python -m pip install --upgrade pip uv
          git clone --depth 1 https://github.com/wundercorp/loki.git /tmp/loki-agent
          cd /tmp/loki-agent
          export LOKI_NIX_BUILD=1
          uv pip install --system -e ".[messaging]" || uv pip install --system -e .
          uv pip install --system "python-telegram-bot[webhooks]>=21.0" aiohttp httpx

      - name: ⚙️ Configure Loki Workspace & Authorization
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_USERS: ${{ secrets.TELEGRAM_ALLOWED_USERS }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          mkdir -p ~/.loki
          
          USER_ID="${TELEGRAM_ALLOWED_USERS:-6486771356}"
          
          # Configure model, Telegram gateway, and workspace root pointing to repository
          cat << EOF > ~/.loki/config.yaml
          database:
            journal_mode: delete
          model:
            default: llama-3.3-70b-versatile
            provider: custom
            base_url: https://api.groq.com/openai/v1
            context_length: 131072
          gateway:
            allow_all_users: true
            platforms:
              telegram:
                enabled: true
                allow_all_users: true
                extra:
                  status_indicator: true
                  allowed_users:
                    - "6486771356"
                    - "${USER_ID}"
                    - "Dkx"
          workspace:
            root: "${GITHUB_WORKSPACE}"
          EOF

          cat << EOF > ~/.loki/.env
          TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
          TELEGRAM_ALLOWED_USERS=6486771356,${USER_ID},Dkx
          TELEGRAM_HOME_CHANNEL=6486771356
          GATEWAY_ALLOW_ALL_USERS=true
          TELEGRAM_ALLOW_ALL_USERS=true
          CUSTOM_API_KEY=${GROQ_API_KEY}
          CUSTOM_BASE_URL=https://api.groq.com/openai/v1
          GROQ_API_KEY=${GROQ_API_KEY}
          GEMINI_API_KEY=${GEMINI_API_KEY}
          GOOGLE_API_KEY=${GOOGLE_API_KEY:-$GEMINI_API_KEY}
          OPENAI_API_KEY=${OPENAI_API_KEY}
          LOKI_WORKSPACE=${GITHUB_WORKSPACE}
          EOF

          # Register Telegram Auth Login
          mkdir -p ~/.loki/gateway
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            echo "$TELEGRAM_BOT_TOKEN" | python3 -m loki_cli.main auth login telegram --token-stdin 2>/dev/null || true
          fi

      - name: 🌐 Run Gateway 24/7 + Auto-Sync Code to GitHub
        env:
          PYTHONPATH: /tmp/loki-agent
          LOKI_HOME: /home/runner/.loki
          LOKI_NIX_BUILD: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_USERS: 6486771356,Dkx
          TELEGRAM_HOME_CHANNEL: "6486771356"
          GATEWAY_ALLOW_ALL_USERS: "true"
          TELEGRAM_ALLOW_ALL_USERS: "true"
          LOKI_TELEGRAM_ALLOW_ALL: "true"
          CUSTOM_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CUSTOM_BASE_URL: https://api.groq.com/openai/v1
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LOKI_WORKSPACE: ${{ github.workspace }}
        run: |
          echo "🚀 Starting Loki 24/7 Telegram Gateway with Auto-Git Persistence..."
          cd /tmp/loki-agent
          export LOKI_NIX_BUILD=1
          
          # Launch Gateway in background
          if command -v loki &> /dev/null; then
            loki gateway run &
          elif python3 -c "import loki_cli" 2>/dev/null; then
            python3 -m loki_cli.main gateway run &
          else
            python3 -m loki gateway run &
          fi
          
          GATEWAY_PID=$!
          echo "✅ Gateway active with PID: $GATEWAY_PID"
          
          cd "${GITHUB_WORKSPACE}"
          
          # Real-time Auto Sync loop: checks every 60 seconds for newly generated files
          while kill -0 $GATEWAY_PID 2>/dev/null; do
            sleep 60
            
            # Check if Loki generated/modified files in the workspace repo
            if [[ -n $(git status --porcelain) ]]; then
              echo "📝 Changes detected in repository! Committing and pushing to GitHub..."
              git add -A
              git commit -m "feat(loki): autonomous code update from telegram [skip ci]" || true
              git push origin main || git push || true
              echo "✅ Successfully synced code changes to GitHub repository!"
            fi
          done
          
          # Final sync upon gateway exit
          if [[ -n $(git status --porcelain) ]]; then
            git add -A
            git commit -m "feat(loki): final code persistence upon session completion [skip ci]" || true
            git push origin main || git push || true
          fi
