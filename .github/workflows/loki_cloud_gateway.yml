name: Loki 24/7 Cloud Gateway & Auto-Git Sync

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

concurrency:
  group: loki-cloud-gateway
  cancel-in-progress: true

jobs:
  gateway:
    name: 🚀 24/7 Autonomous Telegram Gateway + OmniRoute Engine
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ⚙️ Setup Git Config
        run: |
          git config --global user.name "Loki Autonomous Bot"
          git config --global user.email "loki-bot@users.noreply.github.com"
          git config --global pull.rebase true

      - name: ⚡ Install uv, Loki Core & Telegram Messaging Dependencies
        env:
          LOKI_NIX_BUILD: "1"
        run: |
          python -m pip install --upgrade pip uv
          git clone --depth 1 https://github.com/wundercorp/loki.git /tmp/loki-agent
          cd /tmp/loki-agent
          export LOKI_NIX_BUILD=1
          uv pip install --system -e ".[messaging]" || uv pip install --system -e .
          uv pip install --system "python-telegram-bot[webhooks]>=21.0" aiohttp httpx

      - name: ⚙️ Configure Loki Workspace, OmniRoute & Authorization
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_USERS: ${{ secrets.TELEGRAM_ALLOWED_USERS }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          mkdir -p ~/.loki
          
          # Reset any hanging Telegram webhook/polling sessions to prevent conflict
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            echo "🔄 Resetting Telegram session state..."
            curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/deleteWebhook?drop_pending_updates=true" || true
          fi
          
          USER_ID="${TELEGRAM_ALLOWED_USERS:-6486771356}"
          
          # Dynamic OmniRoute Provider Selection
          # Priority: OpenRouter (Billion Tokens Pool) -> Groq (Blazing 70B) -> Gemini (2M Token Context)
          if [ -n "$OPENROUTER_API_KEY" ]; then
            MODEL_DEFAULT="deepseek/deepseek-r1:free"
            BASE_URL="https://openrouter.ai/api/v1"
            PRIMARY_API_KEY="$OPENROUTER_API_KEY"
            echo "🌐 OmniRoute active: OpenRouter Multi-Model Billion Token Pool"
          elif [ -n "$GROQ_API_KEY" ]; then
            MODEL_DEFAULT="llama-3.3-70b-versatile"
            BASE_URL="https://api.groq.com/openai/v1"
            PRIMARY_API_KEY="$GROQ_API_KEY"
            echo "⚡ OmniRoute active: Groq Ultra-Fast Llama 3.3 70B"
          else
            MODEL_DEFAULT="gemini-2.0-flash"
            BASE_URL="https://generativelanguage.googleapis.com/v1beta/openai/"
            PRIMARY_API_KEY="${GEMINI_API_KEY:-$GOOGLE_API_KEY}"
            echo "✨ OmniRoute active: Google Gemini 2.0 High-Speed Engine"
          fi
          
          # Write clean YAML config
          cat << EOF > ~/.loki/config.yaml
          database:
            journal_mode: delete
          model:
            default: ${MODEL_DEFAULT}
            provider: custom
            base_url: ${BASE_URL}
            api_key: "${PRIMARY_API_KEY}"
            context_length: 131072
          gateway:
            allow_all_users: true
            platforms:
              telegram:
                enabled: true
                allow_all_users: true
                extra:
                  status_indicator: true
                  allowed_users:
                    - "6486771356"
                    - "${USER_ID}"
                    - "Dkx"
          workspace:
            root: "${GITHUB_WORKSPACE}"
          terminal:
            cwd: "${GITHUB_WORKSPACE}"
          EOF

          cat << EOF > ~/.loki/.env
          TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
          TELEGRAM_ALLOWED_USERS=6486771356,${USER_ID},Dkx
          TELEGRAM_HOME_CHANNEL=6486771356
          GATEWAY_ALLOW_ALL_USERS=true
          TELEGRAM_ALLOW_ALL_USERS=true
          CUSTOM_API_KEY=${PRIMARY_API_KEY}
          CUSTOM_BASE_URL=${BASE_URL}
          OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
          GROQ_API_KEY=${GROQ_API_KEY}
          DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
          GEMINI_API_KEY=${GEMINI_API_KEY}
          GOOGLE_API_KEY=${GOOGLE_API_KEY:-$GEMINI_API_KEY}
          OPENAI_API_KEY=${OPENAI_API_KEY}
          NVIDIA_API_KEY=${NVIDIA_API_KEY}
          LOKI_WORKSPACE=${GITHUB_WORKSPACE}
          EOF

          # Register Telegram Auth Login
          mkdir -p ~/.loki/gateway
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            echo "$TELEGRAM_BOT_TOKEN" | python3 -m loki_cli.main auth login telegram --token-stdin 2>/dev/null || true
          fi

      - name: 🌐 Run Gateway 24/7 + Auto-Sync Code to GitHub
        env:
          PYTHONPATH: "/tmp/loki-agent"
          LOKI_HOME: /home/runner/.loki
          LOKI_NIX_BUILD: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_USERS: 6486771356,Dkx
          TELEGRAM_HOME_CHANNEL: "6486771356"
          GATEWAY_ALLOW_ALL_USERS: "true"
          TELEGRAM_ALLOW_ALL_USERS: "true"
          LOKI_TELEGRAM_ALLOW_ALL: "true"
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          LOKI_WORKSPACE: ${{ github.workspace }}
          AUTH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          echo "🚀 Starting Loki 24/7 Telegram Gateway in project workspace with OmniRoute..."
          cd "${GITHUB_WORKSPACE}"
          export LOKI_NIX_BUILD=1
          export PYTHONPATH="/tmp/loki-agent:$PYTHONPATH"
          
          # Launch Gateway in background from the repository root
          if python3 -c "import loki_cli" 2>/dev/null; then
            python3 -m loki_cli.main gateway run &
          elif command -v loki &> /dev/null; then
            loki gateway run &
          else
            python3 -m loki gateway run &
          fi
          
          GATEWAY_PID=$!
          echo "✅ Gateway active with PID: $GATEWAY_PID (Working directory: ${GITHUB_WORKSPACE})"
          
          # Real-time Auto Sync loop: checks every 60 seconds for newly generated files
          while kill -0 $GATEWAY_PID 2>/dev/null; do
            sleep 60
            
            # Check if Loki generated/modified files in the workspace repo
            if [[ -n $(git status --porcelain) ]]; then
              echo "📝 Changes detected in repository! Committing and pushing to GitHub..."
              git add -A
              git commit -m "feat(loki): autonomous code update from telegram [skip ci]" || true
              git push "https://x-access-token:${AUTH_TOKEN}@github.com/${{ github.repository }}.git" main || git push origin main || true
              echo "✅ Successfully synced code changes to GitHub repository!"
            fi
          done
          
          # Final sync upon gateway exit
          if [[ -n $(git status --porcelain) ]]; then
            git add -A
            git commit -m "feat(loki): final code persistence upon session completion [skip ci]" || true
            git push "https://x-access-token:${AUTH_TOKEN}@github.com/${{ github.repository }}.git" main || git push origin main || true
          fi
